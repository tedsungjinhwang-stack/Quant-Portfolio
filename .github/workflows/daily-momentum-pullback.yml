name: Daily Momentum Screener (2-track + regime)

on:
  schedule:
    # 22:10 UTC = 07:10 KST (다음날 아침). 미국 장 마감(20~21 UTC) 이후라
    # 한 번 실행으로 그 UTC 날짜의 미국·한국 양 시장 종가를 모두 반영합니다.
    # 요일은 UTC 기준(=거래일)으로 1-5(월~금) → 각 거래일 종가를 빠짐없이 캡처.
    #  · 금요일 종가는 토요일 07:10 KST에 떠서 주말 내내 확인 가능.
    #  · 월요일 아침엔 직전(토) 실행분의 금요일 종가가 유지됨.
    # (예약 실행은 레포 '기본 브랜치'의 워크플로만 동작합니다.)
    - cron: "10 22 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행

permissions:
  contents: write          # 리포트 파일 커밋용

concurrency:
  group: momentum-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r screener/requirements.txt

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener/screener.py

      - name: Commit reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ public/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "screener: report $(date -u +%Y-%m-%d)"
            # 같은 브랜치에 다른 푸시가 끼어들어 거부될 수 있으므로 rebase 후 재시도
            # (reports/·public/ 은 생성 산출물이라 충돌 시 방금 생성분을 우선 -X theirs)
            n=0
            until git push origin HEAD:"${GITHUB_REF_NAME}"; do
              n=$((n+1))
              if [ "$n" -gt 5 ]; then echo "push 5회 실패"; exit 1; fi
              echo "push 거부 — 원격 변경 rebase 후 재시도 ($n/5)"
              git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}"
              sleep $((n * 3))
            done
          fi
